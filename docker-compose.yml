  # ===========================================================================
  # FRONT - Serveur HTTP Nginx de façade (alpine = distribution minimale)
  # ===========================================================================
  # Rôle : point d'entrée unique des clients (port 80). Sert les fichiers
  #        statiques du build React et fait office de reverse proxy vers
  #        restapi (HTTP/REST) et wsapi (HTTP + WebSocket).
  # ===========================================================================
  front:

    # Image Nginx Alpine (CDC : "distribution minimale de sécurité (alpine)").
    # Alpine = ~5 Mo, surface d'attaque minimale.
    image: nginx:alpine

    # Redémarrage automatique (CDC).
    restart: unless-stopped

    networks:
      # app_network uniquement : nginx n'a PAS besoin d'accéder directement aux
      # BDs ou au broker (isolation réseau CDC).
      - app_network

    ports:
      # Port 80 exposé publiquement (HTTP). Seul port ouvert sur l'hôte.
      # Moindre privilège sur les ports (CDC) : on n'expose pas d'autres ports.
      - "80:80"

    volumes:
      # Configuration Nginx de PRODUCTION (adaptée pour Docker avec les noms
      # de services restapi et wsapi). Monté en lecture seule.
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

      # Volume partagé avec webapp : contient le build React/Webpack.
      # Monté en LECTURE SEULE pour nginx (il ne doit qu'envoyer les fichiers,
      # jamais les modifier). CDC : "lecture seule si pas de besoin en écriture".
      # CDC : "Il est nécessaire de s'assurer que cet espace soit performant."
      # → Volume nommé Docker (plus rapide qu'un bind mount hôte).
      - webapp_dist:/var/www/app:ro

    # ---- Vérification de santé ----
    # wget -qO- : requête GET silencieuse sur /health (endpoint dédié nginx).
    # L'endpoint /health retourne immédiatement 200 JSON sans passer par les APIs.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout:  10s
      retries:  10
      start_period: 10s

    # ---- Dépendances ----
    # CDC : "Le front ne doit se lancer que si les 2 api sont lancées."
    # service_started (pas service_healthy) : front peut démarrer dès que les
    # APIs sont lancées (nginx gère les backends indisponibles temporairement).
    depends_on:
      restapi:
        condition: service_started
      wsapi:
        condition: service_started


  # ===========================================================================
  # WEBAPP - Builder React/Webpack (profil "build", exécution unique)
  # ===========================================================================
  # Rôle : construire l'application cliente React en fichiers statiques.
  # CDC : "ne pas faire d'image personnalisée, monter le code-source par un
  #        point de montage [...] doit pouvoir être exécuté rapidement suite à
  #        une modification du code-source."
  # NE PAS lancer avec `docker compose up` (profil "build" = protection).
  # Lancer avec : docker compose --profile build run --rm webapp
  # ===========================================================================
  webapp:

    # Image Node.js 22 Alpine (CDC : "Node.js ≥ 22 nécessaire pour le build").
    image: node:22-alpine

    # Profil "build" : ce service n'est PAS démarré par `docker compose up`.
    # Il faut explicitement spécifier --profile build pour l'activer.
    # CDC : "un profil doit être prévu pour ne pas le lancer malencontreusement".
    profiles:
      - build

    volumes:
      # Source React montée en lecture-écriture (npm crée node_modules/ ici).
      - ./LogisticoTrain_codebase/app:/app:rw

      # Volume partagé avec front : webpack écrit le build dans /app/dist.
      # Ce volume est LU par front en lecture seule.
      # CDC : "Le résultat du build doit être automatiquement accessible, en
      #        lecture seule, par le service front."
      # CDC : "Il est nécessaire de s'assurer que ce build soit persistant."
      # → Volume nommé = persistant et performant.
      - webapp_dist:/app/dist

    working_dir: /app

    # Installation des dépendances npm puis build de production via webpack.prod.js
    # (script "build" défini dans package.json pointe vers webpack.prod.js).
    command: ["sh", "-c", "npm install && npm run build"]

    # CDC : "S'il n'y a pas besoin d'un réseau bridge 'par défaut' pour la pile
    #        docker compose, réutilisez le réseau bridge par défaut de Docker
    #        pour le builder."
    # network_mode: bridge = réseau bridge natif Docker (docker0), PAS le réseau
    # créé par Compose. Ce service ne communique avec aucun autre service,
    # il a juste besoin d'internet pour npm install.
    network_mode: bridge


  # ===========================================================================
  # PHPMYADMIN - Interface web d'administration MariaDB (profil "dev-tool")
  # ===========================================================================
  # CDC : "permettre d'accéder rapidement et facilement aux bases de données"
  #        "accessible directement depuis leur port d'accès, pas à travers nginx"
  #        "accessible que depuis la machine locale"
  # ===========================================================================
  phpmyadmin:

    image: phpmyadmin/phpmyadmin:latest

    # Profil "dev-tool" : uniquement avec --profile dev-tool
    profiles:
      - dev-tool

    networks:
      # db_network : accès à sqldatabase. PAS dans app_network → non accessible
      # via nginx (CDC : "pas à travers le serveur front nginx").
      - db_network

    ports:
      # 127.0.0.1: → expose UNIQUEMENT sur localhost de la machine hôte.
      # CDC : "accessible que depuis la machine locale".
      # Pas d'exposition publique (0.0.0.0).
      - "127.0.0.1:8081:80"

    environment:
      # Adresse du serveur MariaDB (nom de service Docker Compose).
      PMA_HOST: sqldatabase
      PMA_PORT: 3306
      # Pas de PMA_USER/PMA_PASSWORD : l'utilisateur entre ses credentials
      # manuellement sur la page de connexion phpmyadmin (plus sécurisé,
      # et phpmyadmin ne supporte pas les variables *_FILE).


  # ===========================================================================
  # MONGO-EXPRESS - Interface web d'administration MongoDB (profil "dev-tool")
  # ===========================================================================
  mongo-express:

    image: mongo-express:latest

    profiles:
      - dev-tool

    networks:
      # db_network uniquement. PAS dans app_network → non accessible via nginx.
      - db_network

    ports:
      # 127.0.0.1: → localhost seulement (CDC : "machine locale uniquement").
      - "127.0.0.1:8082:8081"

    environment:
      # Adresse du serveur MongoDB (nom de service Docker Compose).
      ME_CONFIG_MONGODB_SERVER: nosqldatabase
      ME_CONFIG_MONGODB_PORT:   27017
      # NOTE : mongo-express ne supporte pas les variables *_FILE pour les
      # credentials MongoDB. Conformément à la règle CDC, les credentials sont
      # fournis via env_file (fichier externe, pas dans docker-compose.yml).
      # Ce fichier est dans secrets/ car il contient les identifiants root Mongo.
    env_file:
      - ./secrets/mongo-express.env

    # mongo-express doit attendre que MongoDB soit prêt.
    depends_on:
      nosqldatabase:
        condition: service_healthy


# =============================================================================
# VOLUMES
# =============================================================================
# CDC : "Aucun volume de données anonyme ne doit être créé."
# Tous les volumes sont NOMMÉS (déclarés ici).
# Les volumes nommés Docker sont plus PERFORMANTS que les bind mounts car
# ils sont gérés directement par le daemon Docker sans passer par la couche
# de virtualisation du filesystem hôte.
# =============================================================================
volumes:

  # Données persistantes de MariaDB (tables voie, rames, taches)
  mariadb_data:
    driver: local

  # Données persistantes de MongoDB (collection history-db)
  mongodb_data:
    driver: local

  # Données persistantes de RabbitMQ (queues, exchanges persistés)
  rabbitmq_data:
    driver: local

  # Cache Maven (.m2/repository) pour wsapi : évite de re-télécharger les
  # dépendances JAR à chaque recompilation. Gain de temps significatif.
  # CDC : "espace de stockage persistant et performant" pour le cache maven.
  maven_cache:
    driver: local

  # Dossier target/ de wsapi : contient les .class et le JAR compilé.
  # Séparé du bind mount source pour des I/O plus rapides lors de la compilation.
  # CDC : "espace également persistant et performant" pour target/.
  wsapi_target:
    driver: local

  # Build React produit par webapp, consommé par front en lecture seule.
  # CDC : "build persistant" + "performances en lecture et en écriture optimisées".
  # Volume nommé local = solution optimale (persistant + performant).
  webapp_dist:
    driver: local


# =============================================================================
# NETWORKS
# =============================================================================
# CDC : "Isolation réseau : segmentation des réseaux pour ne laisser un accès
#        aux bases de données qu'aux services qui en ont le besoin, et de même
#        pour le broker."
#
# db_network     : sqldatabase + nosqldatabase + restapi + wsapi + phpmyadmin
#                  + mongo-express (accès BDs restreint à ces services)
# broker_network : broker + wsapi (accès broker restreint à wsapi uniquement)
# app_network    : restapi + wsapi + front (communication APIs ↔ nginx)
# =============================================================================
networks:

  # Réseau des bases de données : isolé, seules les APIs et les outils dev
  # peuvent accéder aux BDs.
  db_network:
    driver: bridge

  # Réseau du broker : isolé, seul wsapi communique avec RabbitMQ.
  broker_network:
    driver: bridge

  # Réseau applicatif : nginx reverse-proxy vers les deux APIs.
  app_network:
    driver: bridge


# =============================================================================
# SECRETS
# =============================================================================
# CDC : "On ne veut pas inscrire les identifiants directement dans docker-compose.yml"
# Tous les secrets sont des fichiers externes dans le dossier secrets/.
# Ce dossier doit être protégé (.gitignore, permissions restreintes).
# Les secrets sont montés en lecture seule dans /run/secrets/<nom> du conteneur.
# =============================================================================
secrets:

  # --- MariaDB ---
  mariadb_root_password:
    file: ./secrets/mariadb_root_password.txt
  mariadb_user:
    file: ./secrets/mariadb_user.txt
  mariadb_password:
    file: ./secrets/mariadb_password.txt
  mariadb_database:
    file: ./secrets/mariadb_database.txt

  # --- MongoDB ---
  mongo_root_user:
    file: ./secrets/mongo_root_user.txt
  mongo_root_password:
    file: ./secrets/mongo_root_password.txt
  mongo_app_user:
    file: ./secrets/mongo_app_user.txt
  mongo_app_password:
    file: ./secrets/mongo_app_password.txt

  # --- RabbitMQ ---
  broker_user:
    file: ./secrets/broker_user.txt
  broker_password:
    file: ./secrets/broker_password.txt
  # Fichier de configuration STOMP complet (contient les credentials STOMP).
  # Monté directement sur /etc/rabbitmq/conf.d/30-stomp.conf via `target`.
  rabbitmq_stomp_conf:
    file: ./secrets/rabbitmq_stomp.conf

  # --- RESTApi ---
  restapi_config:
    file: ./secrets/restapi_config.py

  # --- RealtimeApi ---
  wsapi_application_properties:
    file: ./secrets/wsapi_application.properties


# =============================================================================
# CONFIGS
# =============================================================================
# Les configs sont pour les fichiers de configuration NON sensibles
# (pas de credentials). Elles sont aussi montées en lecture seule.
# =============================================================================
configs:

  # Liste des plugins RabbitMQ à activer (pas de credentials = config, pas secret)
  rabbitmq_enabled_plugins:
    file: ./config/rabbitmq/enabled_plugins
