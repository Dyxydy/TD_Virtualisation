      # app_network : exposé à nginx (front) pour le reverse proxy.
      - app_network

    secrets:
      # Le fichier config.py de PRODUCTION est monté en tant que secret sur
      # /app/config.py, écrasant la config de dev embarquée dans l'image.
      # target = chemin exact dans le conteneur (hors /run/secrets/).
      # Tout le fichier est un secret car il contient les credentials BDs.
      - source: restapi_config
        target: /app/config.py
        mode: 0440

    # ---- Dépendances avec condition de santé ----
    # CDC : "les api REST et Realtime ne doivent se lancer que si les bases de
    # données sont lancées ET considérées saines".
    # service_healthy = attendre que le healthcheck soit vert (not just started).
>>>>>>> Claude
