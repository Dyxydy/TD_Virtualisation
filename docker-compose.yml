  # ===========================================================================
  # WSAPI - RealTime API Java Spring (source montée, pas d'image custom)
  # ===========================================================================
  # CDC : "Le composant RealtimeApi doit pouvoir être redéployé rapidement suite
  #        à une modification du code-source : il est conseillé de ne pas faire
  #        d'image personnalisée, et de monter le code-source par un point de
  #        montage."
  # ===========================================================================
  wsapi:

    # Image stock Maven avec JDK 21 (CDC : "JDK Java 21 minimum et maven 3").
    # eclipse-temurin est la distribution OpenJDK de référence (AdoptOpenJDK).
    image: maven:3.9-eclipse-temurin-21

    # Redémarrage automatique (CDC).
    restart: unless-stopped

    networks:
      - db_network      # accès à sqldatabase et nosqldatabase
      - broker_network  # accès au broker RabbitMQ (STOMP)
      - app_network     # exposé à nginx (front)

    volumes:
      # Source code monté en lecture-écriture (Maven crée target/ dans le dossier
      # projet). Le flag rw est nécessaire pour que Maven puisse compiler.
      - ./LogisticoTrain_codebase/RealtimeAPI:/app:rw

      # Cache Maven (~/.m2) dans un volume nommé PERSISTANT et PERFORMANT.
      # CDC : "Le service wsapi utilise un cache maven pour compiler son code.
      #        Il est nécessaire de prévoir un espace de stockage persistant et
      #        performant à cet effet."
      # Un volume nommé (vs bind mount) est plus rapide car il évite la couche
      # de traduction du système de fichiers hôte (important sur Windows/macOS).
      - maven_cache:/root/.m2

      # Dossier target/ dans un volume nommé PERSISTANT et PERFORMANT.
      # CDC : "Le service wsapi compile le code source java dans un espace dédié
      #        (dossier target/). Il est nécessaire de s'assurer que cet espace
      #        soit également persistant et performant."
      # Séparer target/ du bind mount source améliore les performances de
      # compilation (I/O intensif sur les .class et .jar générés).
      - wsapi_target:/app/target

    secrets:
      # Le fichier application.properties de PRODUCTION est monté comme secret.
      # Spring Boot est lancé avec --spring.config.location pour lire ce fichier
      # au lieu de celui embarqué dans src/main/resources/ (qui est la config dev).
      - source: wsapi_application_properties
        target: /run/secrets/wsapi_application.properties
        mode: 0440

    working_dir: /app

    # Spring Boot est lancé via Maven spring-boot:run.
    # --spring.config.location pointe vers le fichier de config production (secret).
    # Les propriétés du secret écrasent celles de src/main/resources/application.properties.
    command:
      - mvn
      - spring-boot:run
      - -Dspring-boot.run.arguments=--spring.config.location=/run/secrets/wsapi_application.properties

    # ---- Dépendances avec condition de santé ----
    # CDC : "l'api Realtime doit en plus attendre que le broker soit lancé et sain".
>>>>>>> Claude
