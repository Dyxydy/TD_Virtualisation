version: "3.9"

services:

#####API#####

  restapi:
    build: ./RESTApi
    ports:
      - "5001:5001"
    depends_on:
      sqldatabase:
        condition: service_healthy
      nosqldatabase:
        condition: service_healthy
    restart: unless-stopped

  wsapi:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /app
    volumes:
      - ../RealtimeApi:/app
      - ./volumes/maven-cache:/root/.m2
      - ./volumes/wsapi-target:/app/target
    command: mvn spring-boot:run
    ports:
      - "8080:8080"
    depends_on:
      sqldatabase:
        condition: service_healthy
      nosqldatabase:
        condition: service_healthy
      broker:
        condition: service_healthy
    restart: unless-stopped

  webapp:
    image: node:22
    profiles:
      - builder
    working_dir: /app
    volumes:
      - ../app:/app
      - ./volumes/webapp-build:/app/dist
    command: sh -c "npm install && npm run build"

#####BDD#####

  sqldatabase:
    image: mariadb:11
    environment:
      MYSQL_DATABASE: logisticotrain
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - ./volumes/mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  nosqldatabase:
    image: mongo:6
    volumes:
      - ./volumes/mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  broker:
    image: rabbitmq:3.12-management
    ports:
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped