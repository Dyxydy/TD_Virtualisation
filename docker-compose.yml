# =============================================================================
# DOCKER COMPOSE - Logistico-Train
# =============================================================================
#
# Ce fichier orchestre plusieurs conteneurs qui forment ensemble l'application.
# Chaque "service" = un conteneur. Docker Compose les lance, les relie et les
# gère ensemble.
#
# CONCEPTS CLÉS :
#
#  image / build
#    "image" : utilise une image prête à l'emploi depuis Docker Hub.
#    "build" : construit une image depuis un Dockerfile local.
#
#  volumes
#    Permettent de persister des données hors du conteneur et de partager
#    des fichiers entre conteneurs. Deux types :
#    - Nommés (ex: mariadb_data:/var/lib/mysql) : gérés par Docker, plus
#      performants. Déclarés dans la section "volumes:" en bas du fichier.
#    - Bind mount (ex: ./config/nginx.conf:/etc/…:ro) : lie un fichier de
#      l'hôte à un chemin dans le conteneur. ":ro" = lecture seule.
#
#  networks
#    Réseaux virtuels pour que les conteneurs se parlent entre eux.
#    Un conteneur ne peut joindre que les services dans le même réseau.
#    → Isolation : les bases de données ne sont accessibles qu'aux APIs.
#
#  secrets
#    Fichiers sensibles (mots de passe, configs avec credentials) montés dans
#    /run/secrets/<nom> dans le conteneur. Évite d'écrire les credentials en
#    clair dans ce fichier. Déclarés dans la section "secrets:" en bas.
#
#  configs
#    Comme les secrets mais pour des fichiers non sensibles (sans credentials).
#    Déclarés dans la section "configs:" en bas.
#
#  environment
#    Variables d'environnement injectées dans le conteneur. Les images
#    officielles lisent certaines variables pour se configurer automatiquement.
#    Ex: MARIADB_DATABASE_FILE → MariaDB lit le fichier de secret indiqué.
#
#  healthcheck
#    Commande exécutée périodiquement pour savoir si le service est "sain".
#    Un service est "healthy" quand son healthcheck réussit.
#
#  depends_on
#    Définit l'ordre de démarrage. Avec "condition: service_healthy", un
#    service attend que son dépendant soit "healthy" avant de se lancer.
#
#  restart: unless-stopped
#    Redémarre automatiquement le conteneur en cas de crash, sauf si on
#    l'arrête explicitement avec `docker compose stop`.
#
#  profiles
#    Groupe optionnel. Un service avec un profil n'est PAS démarré par
#    `docker compose up`. Il faut passer explicitement --profile <nom>.
#
# COMMANDES :
#   docker compose up -d                              → démarrer la pile
#   docker compose --profile build run --rm webapp   → builder le frontend
#   docker compose --profile dev-tool up -d          → outils admin BDs
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # SQLDATABASE — Base de données relationnelle (MariaDB 11)
  # Stocke : voies, rames en attente/maintenance, tâches restantes.
  # Utilisé par : restapi, wsapi
  # ---------------------------------------------------------------------------
  sqldatabase:
    image: mariadb:11
    restart: unless-stopped
    networks:
      - db_network
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./config/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    secrets:
      - mariadb_root_password
      - mariadb_user
      - mariadb_password
      - mariadb_database
    environment:
      # L'image MariaDB lit les credentials depuis les fichiers secrets (*_FILE).
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
      MARIADB_USER_FILE:          /run/secrets/mariadb_user
      MARIADB_PASSWORD_FILE:      /run/secrets/mariadb_password
      MARIADB_DATABASE_FILE:      /run/secrets/mariadb_database
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout:  10s
      retries:  10
      start_period: 30s


  # ---------------------------------------------------------------------------
  # NOSQLDATABASE — Base de données document (MongoDB 6.0)
  # Stocke : historique de toutes les actions sur les rames (horodaté, auteur).
  # Utilisé par : restapi, wsapi
  # ---------------------------------------------------------------------------
  nosqldatabase:
    image: mongo:6.0
    restart: unless-stopped
    networks:
      - db_network
    volumes:
      - mongodb_data:/data/db
      - ./config/mongodb/init-mongo.sh:/docker-entrypoint-initdb.d/01-init-mongo.sh:ro
    secrets:
      - mongo_root_user
      - mongo_root_password
      - mongo_app_user
      - mongo_app_password
    environment:
      # Credentials root lus depuis les fichiers secrets.
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_root_user
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
    healthcheck:
      test:
        - CMD-SHELL
        - >
          mongosh
          --username "$(cat /run/secrets/mongo_root_user)"
          --password "$(cat /run/secrets/mongo_root_password)"
          --authenticationDatabase admin
          --eval "db.adminCommand('ping').ok"
          --quiet
      interval: 10s
      timeout:  10s
      retries:  10
      start_period: 60s


  # ---------------------------------------------------------------------------
  # BROKER — Bus de messages temps-réel (RabbitMQ 3.12 + plugin STOMP)
  # Relie la RealtimeAPI aux clients WebSocket (opérateur, conducteurs).
  # Utilisé par : wsapi uniquement
  # ---------------------------------------------------------------------------
  broker:
    image: rabbitmq:3.12
    restart: unless-stopped
    networks:
      - broker_network
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    configs:
      # Liste des plugins à activer — pas de credentials → config (pas secret).
      - source: rabbitmq_enabled_plugins
        target: /etc/rabbitmq/enabled_plugins
        mode: 0440
    secrets:
      # Le fichier de conf contient les credentials STOMP → traité comme secret.
      - source: rabbitmq_stomp_conf
        target: /etc/rabbitmq/conf.d/30-stomp.conf
        mode: 0440
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout:  10s
      retries:  10
      start_period: 30s


  # ---------------------------------------------------------------------------
  # RESTAPI — API REST Python Flask (image custom, code embarqué)
  # La base de code étant stable, on construit une image personnalisée avec le
  # code et les fichiers Python précompilés pour de meilleures performances.
  # ---------------------------------------------------------------------------
  restapi:
    build:
      context: ./LogisticoTrain_codebase/RESTApi
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - db_network   # accès aux deux bases de données
      - app_network  # exposé à nginx (reverse proxy)
    secrets:
      # config.py de production monté directement sur /app/config.py.
      # Écrase la config de dev embarquée dans l'image.
      - source: restapi_config
        target: /app/config.py
        mode: 0440
    depends_on:
      sqldatabase:
        condition: service_healthy
      nosqldatabase:
        condition: service_healthy


  # ---------------------------------------------------------------------------
  # WSAPI — RealTime API Java Spring (image stock, code monté en bind mount)
  # Le code étant amené à changer fréquemment, on monte la source directement
  # plutôt que de reconstruire une image à chaque modification.
  # ---------------------------------------------------------------------------
  wsapi:
    image: maven:3.9-eclipse-temurin-21
    restart: unless-stopped
    networks:
      - db_network      # accès aux bases de données
      - broker_network  # accès au broker RabbitMQ
      - app_network     # exposé à nginx
    volumes:
      - ./LogisticoTrain_codebase/RealtimeAPI:/app:rw
      # Cache Maven dans un volume nommé : évite de re-télécharger les JARs.
      - maven_cache:/root/.m2
      # target/ dans un volume nommé : I/O plus rapides pour la compilation.
      - wsapi_target:/app/target
    secrets:
      # application.properties de production monté comme secret.
      - source: wsapi_application_properties
        target: /run/secrets/wsapi_application.properties
        mode: 0440
    working_dir: /app
    command:
      - mvn
      - spring-boot:run
      - -Dspring-boot.run.arguments=--spring.config.location=/run/secrets/wsapi_application.properties
    depends_on:
      sqldatabase:
        condition: service_healthy
      nosqldatabase:
        condition: service_healthy
      broker:
        condition: service_healthy


  # ---------------------------------------------------------------------------
  # FRONT — Serveur HTTP Nginx (alpine = image minimale, ~5 Mo)
  # Point d'entrée unique des navigateurs. Sert les fichiers statiques React
  # et fait office de reverse proxy vers restapi et wsapi.
  # ---------------------------------------------------------------------------
  front:
    image: nginx:alpine
    restart: unless-stopped
    networks:
      - app_network  # nginx n'a pas besoin d'accéder aux BDs ni au broker
    ports:
      - "80:80"  # seul port exposé publiquement (moindre privilège)
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Build React produit par webapp, monté en lecture seule.
      - webapp_dist:/var/www/app:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 10s
      timeout:  10s
      retries:  10
      start_period: 10s
    depends_on:
      restapi:
        condition: service_started
      wsapi:
        condition: service_started


  # ---------------------------------------------------------------------------
  # WEBAPP — Builder React/Webpack (profil "build", exécution unique)
  # Produit les fichiers statiques de l'interface web dans le volume webapp_dist.
  # Ne pas lancer avec `docker compose up` → protégé par le profil "build".
  # Lancer avec : docker compose --profile build run --rm webapp
  # ---------------------------------------------------------------------------
  webapp:
    image: node:22
    profiles:
      - build  # ce service est ignoré sans --profile build
    volumes:
      - ./LogisticoTrain_codebase/app:/app:rw
      # Volume partagé avec front : webpack écrit ici, nginx lit ici.
      - webapp_dist:/app/build
    working_dir: /app
    environment:
      API_EP_URI:    "http://localhost/api/v1"
      RT_API_EP_URI: "http://localhost/wsapi"
    command: ["sh", "-c", "npm install && npm run build"]
    # Réseau bridge natif Docker (docker0) : ce service ne communique avec
    # aucun autre service Compose, il a juste besoin d'internet pour npm install.
    network_mode: bridge


  # ---------------------------------------------------------------------------
  # PHPMYADMIN — Interface web MariaDB (profil "dev-tool")
  # Accessible sur http://localhost:8081 — uniquement depuis la machine locale.
  # ---------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    profiles:
      - dev-tool
    networks:
      - db_network  # accès à sqldatabase, pas dans app_network → non visible via nginx
    ports:
      # 127.0.0.1: → exposé uniquement sur localhost, pas sur le réseau externe.
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: sqldatabase
      PMA_PORT: 3306


  # ---------------------------------------------------------------------------
  # MONGO-EXPRESS — Interface web MongoDB (profil "dev-tool")
  # Accessible sur http://localhost:8082 — uniquement depuis la machine locale.
  # ---------------------------------------------------------------------------
  mongo-express:
    image: mongo-express:latest
    profiles:
      - dev-tool
    networks:
      - db_network  # pas dans app_network → non visible via nginx
    ports:
      - "127.0.0.1:8082:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: nosqldatabase
      ME_CONFIG_MONGODB_PORT:   27017
    # mongo-express ne supporte pas les variables *_FILE → credentials dans un
    # fichier externe (traité comme secret car il contient les credentials root).
    env_file:
      - ./secrets/mongo-express.env
    depends_on:
      nosqldatabase:
        condition: service_healthy


# =============================================================================
# VOLUMES — stockage persistant nommé (déclaration obligatoire)
# Les volumes nommés sont gérés par Docker : plus performants que les bind
# mounts car ils évitent la couche de virtualisation du filesystem hôte.
# =============================================================================
volumes:
  mariadb_data:    # données MariaDB (tables voie, rames, taches)
    driver: local
  mongodb_data:    # données MongoDB (collection historique)
    driver: local
  rabbitmq_data:   # données RabbitMQ (queues, exchanges persistés)
    driver: local
  maven_cache:     # cache .m2 Maven → évite de re-télécharger les JARs
    driver: local
  wsapi_target:    # dossier target/ Java → binaires compilés persistants
    driver: local
  webapp_dist:     # build React → partagé entre webapp (écriture) et front (lecture)
    driver: local


# =============================================================================
# NETWORKS — isolation réseau entre les services
#
#  db_network     : sqldatabase + nosqldatabase + restapi + wsapi + outils dev
#  broker_network : broker + wsapi (seul wsapi communique avec RabbitMQ)
#  app_network    : restapi + wsapi + front (nginx reverse-proxy vers les APIs)
# =============================================================================
networks:
  db_network:
    driver: bridge
  broker_network:
    driver: bridge
  app_network:
    driver: bridge


# =============================================================================
# SECRETS — fichiers sensibles montés dans /run/secrets/<nom> du conteneur
# Les fichiers sources sont dans le dossier secrets/ (hors git).
# =============================================================================
secrets:
  mariadb_root_password:
    file: ./secrets/mariadb_root_password.txt
  mariadb_user:
    file: ./secrets/mariadb_user.txt
  mariadb_password:
    file: ./secrets/mariadb_password.txt
  mariadb_database:
    file: ./secrets/mariadb_database.txt

  mongo_root_user:
    file: ./secrets/mongo_root_user.txt
  mongo_root_password:
    file: ./secrets/mongo_root_password.txt
  mongo_app_user:
    file: ./secrets/mongo_app_user.txt
  mongo_app_password:
    file: ./secrets/mongo_app_password.txt

  broker_user:
    file: ./secrets/broker_user.txt
  broker_password:
    file: ./secrets/broker_password.txt
  rabbitmq_stomp_conf:
    file: ./secrets/rabbitmq_stomp.conf

  restapi_config:
    file: ./secrets/restapi_config.py

  wsapi_application_properties:
    file: ./secrets/wsapi_application.properties


# =============================================================================
# CONFIGS — fichiers de configuration non sensibles (sans credentials)
# =============================================================================
configs:
  rabbitmq_enabled_plugins:
    file: ./config/rabbitmq/enabled_plugins
