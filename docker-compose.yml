version: "3.9"

services:
  sqldatabase:
    image: mariadb:11
    container_name: sqldatabase
    restart: always
    environment:
      MARIADB_DATABASE: logistico
      MARIADB_USER: logistico
      MARIADB_PASSWORD_FILE: /run/secrets/sql_user_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/sql_root_password
    volumes:
      - sqldata:/var/lib/mysql
      - ./init/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - backend-sql
    secrets:
      - sql_user_password
      - sql_root_password

  nosqldatabase:
    image: mongo:6.0
    container_name: nosqldatabase
    restart: always
    volumes:
      - nosqldata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - backend-nosql
    secrets:
      - mongo_password

  broker:
    image: rabbitmq:3.12-management
    container_name: broker
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: logistico
      RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/rabbitmq_password
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - backend-broker
    secrets:
      - rabbitmq_password

  restapi:
    build: ./RESTApi
    container_name: restapi
    restart: always
    depends_on:
      sqldatabase:
        condition: service_healthy
      nosqldatabase:
        condition: service_healthy
    environment:
      SQL_HOST: sqldatabase
      SQL_DB: logistico
      SQL_USER: logistico
      SQL_PASSWORD_FILE: /run/secrets/sql_user_password
      MONGO_HOST: nosqldatabase
    volumes:
      - ./RESTApi:/app:ro
    networks:
      - backend-sql
      - backend-nosql
      - backend-app
    secrets:
      - sql_user_password

  wsapi:
    build: ./RealtimeApi
    container_name: wsapi
    restart: always
    depends_on:
      sqldatabase:
        condition: service_healthy
      nosqldatabase:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      SQL_HOST: sqldatabase
      MONGO_HOST: nosqldatabase
      RABBITMQ_HOST: broker
      RABBITMQ_USER: logistico
      RABBITMQ_PASSWORD_FILE: /run/secrets/rabbitmq_password
    volumes:
      - wsapi-maven-cache:/root/.m2
      - wsapi-target:/app/target
      - ./RealtimeApi:/app
    networks:
      - backend-sql
      - backend-nosql
      - backend-broker
      - backend-app
    secrets:
      - rabbitmq_password

  webapp:
    image: node:22-alpine
    container_name: webapp
    profiles: ["webapp"]
    working_dir: /app
    command: ["npm", "run", "build"]
    volumes:
      - ./app:/app
      - webapp-build:/app/build
    networks:
      - default

  front:
    image: nginx:alpine
    container_name: front
    restart: always
    depends_on:
      restapi:
        condition: service_healthy
      wsapi:
        condition: service_healthy
    volumes:
      - ./vendorConfigurations/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - webapp-build:/usr/share/nginx/html:ro
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - backend-app
      - public

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    profiles: ["dev-tool"]
    restart: unless-stopped
    environment:
      PMA_HOST: sqldatabase
      PMA_USER: root
      PMA_PASSWORD_FILE: /run/secrets/sql_root_password
    ports:
      - "127.0.0.1:8081:80"
    networks:
      - backend-sql
    secrets:
      - sql_root_password

  mongo-express:
    image: mongo-express
    container_name: mongo-express
    profiles: ["dev-tool"]
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_SERVER: nosqldatabase
      ME_CONFIG_MONGODB_ADMINUSERNAME_FILE: /run/secrets/mongo_admin_user
      ME_CONFIG_MONGODB_ADMINPASSWORD_FILE: /run/secrets/mongo_password
    ports:
      - "127.0.0.1:8082:8081"
    networks:
      - backend-nosql
    secrets:
      - mongo_password
      - mongo_admin_user

volumes:
  sqldata:
  nosqldata:
  rabbitmqdata:
  wsapi-maven-cache:
  wsapi-target:
  webapp-build:

networks:
  backend-sql:
    driver: bridge
  backend-nosql:
    driver: bridge
  backend-broker:
    driver: bridge
  backend-app:
    driver: bridge
  public:
    driver: bridge

secrets:
  sql_user_password:
    file: ./secrets/sql_user_password.txt
  sql_root_password:
    file: ./secrets/sql_root_password.txt
  rabbitmq_password:
    file: ./secrets/rabbitmq_password.txt
  mongo_password:
    file: ./secrets/mongo_password.txt
  mongo_admin_user:
    file: ./secrets/mongo_admin_user.txt
