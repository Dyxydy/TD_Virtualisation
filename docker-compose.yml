# =============================================================================
# docker-compose.yml - Déploiement PRODUCTION Logistico-Train
# =============================================================================
# Auteur(s) : Baptiste (Membre 1 - Infra/DB Lead)
#
# Pour démarrer la pile complète :
#   docker compose up -d
#
# Pour builder l'application cliente React (séparé, profil "build") :
#   docker compose --profile build run --rm webapp
#
# Pour lancer les outils d'administration BDs (profil "dev-tool") :
#   docker compose --profile dev-tool up -d phpmyadmin mongo-express
#
# =============================================================================

services:

  # ===========================================================================
  # SQLDATABASE - Base de données relationnelle de PRODUCTION (MariaDB 11)
  # ===========================================================================
  # Rôle : stocke le modèle de production (voies, rames en attente ou en cours
  #        de maintenance, tâches restantes). Base relationnelle SQL.
  # Utilisé par : restapi, wsapi
  # ===========================================================================
  sqldatabase:

    # Image officielle MariaDB version 11 (CDC : "MariaDB version 11 minimum").
    image: mariadb:11

    # Politique de redémarrage automatique (CDC : "politique de redémarrage
    # automatique sur les bases de données"). unless-stopped = redémarre toujours
    # sauf si on l'arrête explicitement avec `docker compose stop`.
    restart: unless-stopped

    # Réseau(x) auxquel(s) appartient ce service.
    # db_network : réseau isolé réservé aux bases de données et aux APIs.
    # Isolation réseau CDC : seuls les services ayant besoin des BDs
    # sont dans ce réseau (restapi, wsapi, outils dev-tool).
    networks:
      - db_network

    volumes:
      # Volume nommé pour la PERSISTANCE des données MariaDB.
      # /var/lib/mysql = répertoire de données de MariaDB dans le conteneur.
      # Pas de volume anonyme (CDC : "Aucun volume de données anonyme ne doit
      # être créé").
      - mariadb_data:/var/lib/mysql

      # Script d'initialisation du schéma SQL (tables voie, rames, taches).
      # Monté en lecture seule (:ro) : sqldatabase n'a pas besoin d'écrire dedans.
      # Exécuté automatiquement au PREMIER démarrage du conteneur si /var/lib/mysql
      # est vide (mécanisme docker-entrypoint-initdb.d de l'image MariaDB).
      - ./config/mariadb/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    secrets:
      # Les 4 secrets MariaDB sont lus par l'entrypoint de l'image via les
      # variables d'environnement *_FILE ci-dessous (feature native de l'image).
      - mariadb_root_password  # mot de passe du compte root MariaDB
      - mariadb_user           # nom de l'utilisateur applicatif
      - mariadb_password       # mot de passe de l'utilisateur applicatif
      - mariadb_database       # nom de la base de données à créer

    environment:
      # Convention de l'image MariaDB officielle : les variables suffixées _FILE
      # indiquent à l'entrypoint le chemin du fichier secret à lire.
      # Cela évite d'écrire les credentials en clair dans docker-compose.yml.
      #
      # MARIADB_ROOT_PASSWORD_FILE : mot de passe du superutilisateur MariaDB root.
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/mariadb_root_password
      # MARIADB_USER_FILE + MARIADB_PASSWORD_FILE : crée l'utilisateur applicatif
      # avec GRANT ALL PRIVILEGES sur la base MARIADB_DATABASE.
      MARIADB_USER_FILE:          /run/secrets/mariadb_user
      MARIADB_PASSWORD_FILE:      /run/secrets/mariadb_password
      # MARIADB_DATABASE_FILE : crée la base de données au premier démarrage.
      MARIADB_DATABASE_FILE:      /run/secrets/mariadb_database

    # ---- Vérification de santé ----
    # CDC : "vérification de santé sur les bases de données [...] toutes les
    # 10 secondes, 10 secondes avant échéc, 10 tentatives max".
    #
    # healthcheck.sh est le script fourni par l'image MariaDB officielle.
    # --connect        : vérifie qu'une connexion TCP peut être établie.
    # --innodb_initialized : vérifie qu'InnoDB (moteur de stockage) est prêt,
    #                        pas seulement que le processus tourne.
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s    # fréquence des vérifications
      timeout:  10s    # durée max d'une vérification avant échec
      retries:  10     # nombre d'échecs consécutifs avant "unhealthy"
      start_period: 30s  # délai de grâce au démarrage (évite faux positifs)


  # ===========================================================================
  # NOSQLDATABASE - Base de données d'historique orientée document (MongoDB 6.0)
  # ===========================================================================
  # Rôle : stocke le modèle d'historique (chaque action sur les rames :
  #        demande, entrée, rejet, réalisation/ajout de tâches, sortie).
  #        Chaque document est horodaté et comporte l'auteur de l'action.
  # Utilisé par : restapi, wsapi
  # ===========================================================================
  nosqldatabase:

    # Image officielle MongoDB version 6.0
    # (CDC : "MongoDB version 4.4 minimum, ≥6.0 recommandé").
    image: mongo:6.0

    # Redémarrage automatique (CDC).
    restart: unless-stopped

    networks:
      # Même réseau isolé que MariaDB : seuls restapi et wsapi y accèdent.
      - db_network

    volumes:
      # Volume nommé pour la PERSISTANCE des données MongoDB.
      # /data/db = répertoire de données MongoDB dans le conteneur.
      - mongodb_data:/data/db

      # Script d'initialisation MongoDB (création de l'utilisateur applicatif
      # dans la base "history-db"). Monté en lecture seule.
      # Exécuté une seule fois au premier démarrage via docker-entrypoint-initdb.d/.
      # Les scripts .sh sont sourcés avant les .js par l'entrypoint MongoDB.
      - ./config/mongodb/init-mongo.sh:/docker-entrypoint-initdb.d/01-init-mongo.sh:ro

    secrets:
      # Secrets pour le compte root MongoDB (lus par l'entrypoint via *_FILE).
      - mongo_root_user      # nom du superutilisateur root MongoDB
      - mongo_root_password  # mot de passe du superutilisateur root
      # Secrets pour l'utilisateur applicatif (lus par init-mongo.sh).
      - mongo_app_user       # nom de l'utilisateur applicatif (mongoUsr)
      - mongo_app_password   # mot de passe de l'utilisateur applicatif

    environment:
      # Convention de l'image MongoDB officielle : variables *_FILE pour les
      # credentials du compte root (évite les credentials en clair).
      MONGO_INITDB_ROOT_USERNAME_FILE: /run/secrets/mongo_root_user
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      # init-mongo.sh lit lui-même mongo_app_user et mongo_app_password
      # depuis /run/secrets/ (pas de convention *_FILE pour les users perso).

    # ---- Vérification de santé ----
    # mongosh --eval "db.adminCommand('ping')" : commande ping officielle
    # MongoDB qui vérifie que le serveur répond aux commandes.
    # --quiet : supprime la bannière mongosh pour un output propre.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --eval
        - "db.adminCommand('ping').ok"
        - --quiet
      interval: 10s
      timeout:  10s
      retries:  10
      start_period: 30s


  # ===========================================================================
  # BROKER - Serveur de messagerie temps-réel (RabbitMQ 3.12 + plugin STOMP)
  # ===========================================================================
  # Rôle : bus de messages pour la communication temps-réel entre la RealtimeAPI
  #        et les clients WebSocket (opérateur, conducteurs).
  #        Le plugin STOMP expose le port 61613 pour les clients STOMP (Spring).
  # Utilisé par : wsapi uniquement
  # ===========================================================================
  broker:

    # Image officielle RabbitMQ 3.12 (CDC : "RabbitMQ version 3.12 minimum").
    # On utilise la variante de base (sans management embarqué) pour garder
    # le contrôle sur les plugins activés via le fichier enabled_plugins.
    image: rabbitmq:3.12

    # Redémarrage automatique (CDC).
    restart: unless-stopped

    networks:
      # broker_network : réseau isolé réservé au broker et à wsapi.
      # Seul wsapi a besoin d'accéder au broker (pas restapi).
      - broker_network

    volumes:
      # Volume nommé pour la PERSISTANCE des données RabbitMQ
      # (queues, échanges, utilisateurs persistés sur disque).
      # /var/lib/rabbitmq = répertoire de données RabbitMQ dans le conteneur.
      - rabbitmq_data:/var/lib/rabbitmq

    configs:
      # enabled_plugins est une CONFIG (pas un secret) car il ne contient
      # que la liste des plugins à activer, sans credentials.
      # Il est monté directement à l'emplacement attendu par RabbitMQ.
      # mode 0440 : lecture seule pour root et groupe (rabbitmq).
      - source: rabbitmq_enabled_plugins
        target: /etc/rabbitmq/enabled_plugins
        mode: 0440

    secrets:
      # Credentials de l'utilisateur par défaut RabbitMQ (management).
      # L'image officielle supporte RABBITMQ_DEFAULT_USER_FILE et
      # RABBITMQ_DEFAULT_PASS_FILE pour éviter les credentials en clair.
      - broker_user      # → /run/secrets/broker_user
      - broker_password  # → /run/secrets/broker_password

      # Configuration STOMP : ce fichier CONTIENT les credentials STOMP
      # (stomp.default_user / stomp.default_pass). Il ne peut pas externaliser
      # ces valeurs individuellement (format conf RabbitMQ), donc TOUT le fichier
      # est traité comme un SECRET (règle CDC).
      # Il est monté directement dans /etc/rabbitmq/conf.d/ (Docker Compose
      # permet de choisir le chemin cible d'un secret via `target`).
      - source: rabbitmq_stomp_conf
        target: /etc/rabbitmq/conf.d/30-stomp.conf
        mode: 0440

    environment:
      # Variables *_FILE lues par l'entrypoint de l'image RabbitMQ officielle
      # pour créer l'utilisateur par défaut sans l'écrire en clair ici.
      RABBITMQ_DEFAULT_USER_FILE: /run/secrets/broker_user
      RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/broker_password

    # ---- Vérification de santé ----
    # rabbitmq-diagnostics check_port_connectivity : vérifie que RabbitMQ écoute
    # sur ses ports (AMQP, management, STOMP) et répond aux connexions.
    # Plus complet que `rabbitmqctl status` qui vérifie seulement le process.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout:  10s
      retries:  10
      start_period: 30s


  # ===========================================================================
  # RESTAPI - API REST Python Flask (image custom, code source embarqué)
  # ===========================================================================
  # CDC : "image embarquant directement le code source applicatif et si possible
  #        ses fichiers python précompilés" (base de code stable, pas de roadmap).
  # ===========================================================================
  restapi:

    # Build de l'image custom depuis le Dockerfile créé dans RESTApi/.
    # context = dossier envoyé au daemon Docker (source + Dockerfile).
