
# =============================================================================
# Configuration PRODUCTION Nginx - Logistico-Train
# =============================================================================
# Adapté depuis vendorConfigurations/nginx/nginx.conf pour le déploiement Docker.
# Seuls les backends ont été mis à jour pour utiliser les noms de services Docker
# (résolution DNS interne Docker Compose) au lieu des anciens FQDN.
# =============================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    # Nombre maximal de connexions simultanées par worker process.
    worker_connections  1024;
}

http {
    # Gestion des types MIME (Content-Type des réponses)
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Format de log "combined" enrichi avec X-Forwarded-For
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    # sendfile : transfert noyau-à-noyau (évite copie user-space), optimal pour
    # servir les fichiers statiques du build webapp.
    sendfile on;
    # tcp_nopush : regroupe les paquets TCP pour réduire le nombre de segments
    # (fonctionne avec sendfile).
    tcp_nopush on;
    # Taille du bucket pour la table de hachage des server_name
    server_names_hash_bucket_size 128;
    # Timeout de maintien de connexion HTTP keep-alive
    keepalive_timeout 65s;

    # -------------------------------------------------------------------------
    # Variables pour la gestion du reverse proxy (forwarding headers)
    # -------------------------------------------------------------------------
    map $http_host $this_host {
        ""      $host;
        default $http_host;
    }
    map $http_x_forwarded_proto $the_scheme {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $http_x_forwarded_host $the_host {
        default $http_x_forwarded_host;
        ""      $this_host;
    }
    map $arg_v $asset_immutable {
        ""      "";
        default "immutable";
    }
    # Nécessaire pour le proxying WebSocket (upgrade de connexion HTTP → WS)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name logisticotrain;

        # =====================================================================
        #   ADRESSES DES BACKENDS (noms de services Docker Compose)
        # =====================================================================
        # MODIFIÉ PAR RAPPORT AU TEMPLATE : on utilise les noms de services
        # Docker Compose au lieu des anciens FQDN (rest-api.old.logisticotrain.fr).
        # Le DNS interne Docker (127.0.0.11, configuré via `resolver` ci-dessous)
        # résout ces noms dynamiquement, ce qui permet de redémarrer un service
        # sans redémarrer nginx.
        #
        # restapi:5001 → service "restapi" (Flask), port HTTP-ALT 5001
        # wsapi:8080   → service "wsapi"   (Spring Boot), port WS/HTTP 8080
        set $rest_api_backend restapi:5001;
        set $ws_api_backend   wsapi:8080;
        # =====================================================================

        # Masque la version de nginx dans les headers et pages d'erreur
        server_tokens off;

        # En-têtes de sécurité HTTP
        add_header X-Content-Type-Options          "nosniff"      always;
        add_header X-XSS-Protection                "0;"           always;
        add_header X-Robots-Tag                    "none"         always;
        add_header X-Download-Options              "noopen"       always;
        add_header X-Permitted-Cross-Domain-Policies "none"       always;
        add_header Referrer-Policy                 "no-referrer"  always;
        add_header X-Frame-Options                 "SAMEORIGIN"   always;
        fastcgi_hide_header X-Powered-By;

        # Taille max d'upload et timeout
        client_max_body_size    10M;
        client_body_timeout     300s;
        fastcgi_buffers         64 4K;

        # Compression Gzip des réponses (fichiers statiques, JSON API)
        gzip on;
        gzip_vary on;
        gzip_comp_level 4;
        gzip_min_length 256;
        gzip_proxied expired no-cache no-store private no_last_modified no_etag auth;
        gzip_types application/atom+xml application/javascript application/json
                   application/ld+json application/manifest+json application/rss+xml
                   application/vnd.geo+json application/vnd.ms-fontobject
                   application/x-font-ttf application/x-web-app-manifest+json
                   application/xhtml+xml application/xml font/opentype image/bmp
                   image/svg+xml image/x-icon text/cache-manifest text/css
                   text/plain text/vcard text/vnd.rim.location.xloc text/vtt
                   text/x-component text/x-cross-domain-policy;

        # Buffer HTTP/2 pour l'upload
        client_body_buffer_size 512k;

        # Racine des fichiers statiques : volume partagé avec le service webapp
        # (résultat du build React/Webpack)
        root  /var/www/app;
        index index.html;

        # Résolveur DNS interne Docker Compose (adresse fixe du DNS embarqué)
        # Obligatoire pour que les variables $rest_api_backend/$ws_api_backend
        # soient résolues dynamiquement à chaque requête.
        resolver 127.0.0.11;

        # -----------------------------------------------------------------
        # Proxy vers la REST API (Flask) - toutes les routes /api/...
        # -----------------------------------------------------------------
        location ~* ^/api {
            rewrite /api/?(.*) /api/$1 break;
            proxy_pass http://$rest_api_backend;
            proxy_http_version 1.1;
            proxy_redirect off;
            client_max_body_size 100m;
            proxy_set_header Host               $http_host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host   $the_host;
            proxy_set_header X-Forwarded-Proto  $the_scheme;
            proxy_read_timeout   180s;
            proxy_buffering      off;
            proxy_buffer_size    128k;
            proxy_buffers        100 128k;
        }

        # -----------------------------------------------------------------
        # Proxy vers la RealTime API (Spring WebSocket) - routes /wsapi/...
        # Les headers Upgrade/Connection permettent l'upgrade HTTP → WebSocket.
        # -----------------------------------------------------------------
        location ~* ^/wsapi {
            rewrite /wsapi/?(.*) /api/$1 break;
            proxy_pass http://$ws_api_backend;
            proxy_http_version 1.1;
            proxy_redirect off;
            client_max_body_size 100m;
            # Headers WebSocket upgrade
            proxy_set_header Upgrade            $http_upgrade;
            proxy_set_header Connection         $connection_upgrade;
            proxy_set_header Host               $http_host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host   $the_host;
            proxy_set_header X-Forwarded-Proto  $the_scheme;
            proxy_read_timeout   180s;
            proxy_buffering      off;
            proxy_buffer_size    128k;
            proxy_buffers        100 128k;
        }

        # -----------------------------------------------------------------
        # Endpoint de santé nginx (utilisé par le healthcheck Docker)
        # Répond 200 JSON sans écrire dans les logs d'accès.
        # -----------------------------------------------------------------
        location = /health {
            access_log off;
            add_header 'Content-Type' 'application/json';
            return 200 '{"status":"UP"}';
        }

        # -----------------------------------------------------------------
        # SPA fallback : toutes les routes inconnues renvoient index.html
        # (React Router gère le routing côté client)
        # -----------------------------------------------------------------
        try_files $uri /index.html;
    }
}
